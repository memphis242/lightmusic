name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fedora:
    name: fedora43 (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # gcc is the primary compiler (debug, unit-test and release builds); clang is
          # an extra checking layer. Every build job is -Werror (LM_WERROR=ON).
          # Optimised build with the project assertions forced on.
          - name: normal
            cc: gcc
            build_type: RelWithDebInfo
            cmake_args: -DLM_WERROR=ON -DLM_ASSERTS=ON
          # What ships: -O3, hardening flags, assertions compiled out.
          - name: release
            cc: gcc
            build_type: Release
            cmake_args: -DLM_WERROR=ON
          - name: asan-ubsan
            cc: gcc
            build_type: Debug
            cmake_args: -DLM_WERROR=ON -DLM_ASAN=ON
          - name: tsan
            cc: gcc
            build_type: Debug
            cmake_args: -DLM_WERROR=ON -DLM_TSAN=ON
          - name: net-off
            cc: gcc
            build_type: RelWithDebInfo
            cmake_args: -DLM_WERROR=ON -DLM_BUILD_NET=OFF
          - name: clang
            cc: clang
            build_type: RelWithDebInfo
            cmake_args: -DLM_WERROR=ON
          # clang-only UBSan checks (implicit-conversion, local-bounds, nullability).
          - name: clang-asan-ubsan
            cc: clang
            build_type: Debug
            cmake_args: -DLM_WERROR=ON -DLM_ASAN=ON
    steps:
      - uses: actions/checkout@v5

      - name: Check for CMake project
        id: check
        run: |
          if [ -f CMakeLists.txt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No CMakeLists.txt on this ref yet; skipping build and tests."
          fi

      # ThreadSanitizer aborts with "unexpected memory mapping" under the
      # 32-bit mmap ASLR entropy of the ubuntu-24.04 runner kernel. That is a
      # host sysctl a container cannot change, so lower it here on the host and
      # run the Fedora container ourselves (instead of `container:`), for every
      # matrix entry so all jobs share one code path.
      - name: Lower mmap ASLR entropy (TSan)
        if: steps.check.outputs.present == 'true' && matrix.name == 'tsan'
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Build and test in fedora:43
        if: steps.check.outputs.present == 'true'
        run: |
          docker run --rm --init \
            -v "$PWD:/src" -w /src \
            -e LM_FUZZ_SEED=${{ github.run_number }} \
            -e LM_CC=${{ matrix.cc }} \
            fedora:43 \
            .github/ci/build-test.sh ${{ matrix.build_type }} ${{ matrix.cmake_args }}

      - name: Upload test log
        if: failure() && steps.check.outputs.present == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: ctest-${{ matrix.name }}
          path: |
            ctest.log
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  analyze:
    name: fedora43 (${{ matrix.tool }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        tool: [clang-tidy, cppcheck]
    steps:
      - uses: actions/checkout@v5
      - name: Static analysis in fedora:43
        if: hashFiles('CMakeLists.txt') != ''
        run: |
          docker run --rm --init -v "$PWD:/src" -w /src fedora:43 \
            .github/ci/analyze.sh ${{ matrix.tool }}
